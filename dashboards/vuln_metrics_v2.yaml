      id: vuln_exposed_assets_tile
      label: "Internet Exposed Assets"
      value: "vuln_assets_internet_exposed"
      grid:
          x: 2
          y: 0
          w: 2
          h: 2
          min_w: 1
          min_h: 1
  - tile: 
      id: vuln_all
      label: "Vulnerabilities"
