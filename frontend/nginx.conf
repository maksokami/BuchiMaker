server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # CSP: Allow Vue, Gridstack, Chart.js, FontAwesome, Google Fonts via CDNs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self';";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the backend container (Docker network service
    # name "backend") — this is what lets the SSO session cookie
    # (app/core/auth.py's SESSION_COOKIE_NAME) flow with zero per-request
    # frontend code changes: as far as the browser is concerned, the API
    # and the page it's calling from are the same origin.
    # Note: $http_host, not nginx's $host — $host silently drops the port
    # (e.g. "localhost" instead of "localhost:3000"), which breaks anything
    # the backend derives from the Host header, such as the RP-initiated
    # logout post_logout_redirect_uri in app/api/auth.py (Keycloak/most
    # OIDC providers reject a redirect URI that doesn't exactly match one
    # registered on the client, port included).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disable caching for frontend assets completely
    location ~* \.(html|js|css|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
